function setCar(){if(car)scene.remove(car.g);car=buildCar(CARS[carI],true,paintC);car.spot.intensity=map&&map.night?3:.4;scene.add(car.g);setEngine();info()}
$("go").onclick=()=>{audio();if(ac&&ac.state=="suspended")ac.resume();setEngine();startRace()};$("mb").onclick=toMenu;
buildWorld(0);setCar();showCars();showMaps();showPaint();aiG.visible=false;px=pz=0;h=0;pi=0;lap=-1;loop();
</script></body></html>
